<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="header">
            <div>
                <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
                <h1>My Planner</h1>
                <p class="subtitle">Make today count.</p>
            </div>
            <div class="date-card">
                <span id="todayDate">TODAY</span>
                <strong id="todayDay">--</strong>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <strong id="totalTasks">0</strong>
            </div>
            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </div>
            <div class="stat-card">
                <span>Remaining</span>
                <strong id="remainingTasks">0</strong>
            </div>
        </section>

        <section class="progress-card">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">YOUR PROGRESS</p>
                    <h2>Daily Overview</h2>
                </div>
                <strong id="percentage">0%</strong>
            </div>

            <div class="progress-track">
                <div id="progressFill"></div>
            </div>

            <p id="progress">0 of 0 tasks completed</p>
        </section>

        <section class="task-box">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">STAY ORGANIZED</p>
                    <h2>Today's Tasks</h2>
                </div>
            </div>

            <div class="task-input">
    <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
    >

    <select id="taskPriority">
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="low">Low Priority</option>
    </select>

    <input
        type="date"
        id="taskDeadline"
    >

    <button id="addTask">+ Add Task</button>
</div>

<div class="task-filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
</div>
            <ul id="taskList"></ul>
        </section>

        <footer>
            <p>Small steps. Big progress.</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
